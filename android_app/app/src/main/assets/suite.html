<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Macondo Express Suite</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070b14;
      font-family: -apple-system, sans-serif;
    }
    .top-switcher {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 44px;
      background: #0d1527;
      border-bottom: 1px solid #1a273f;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      z-index: 1000;
      padding-top: env(safe-area-inset-top);
    }
    .switch-btn {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      border: 1px solid transparent;
      cursor: pointer;
      background: #131f38;
      color: #94a3b8;
    }
    .switch-btn.active-pax {
      background: rgba(16, 185, 129, 0.2);
      border-color: #10b981;
      color: #34d399;
    }
    .switch-btn.active-cond {
      background: rgba(245, 158, 11, 0.2);
      border-color: #f59e0b;
      color: #fbbf24;
    }
    .frame-container {
      width: 100%;
      height: calc(100% - 44px);
      margin-top: 44px;
      border: none;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="top-switcher">
    <button class="switch-btn active-pax" id="btnPax" onclick="cargar('pasajero.html', this, 'active-pax')">
      📱 Modo Pasajero
    </button>
    <button class="switch-btn" id="btnCond" onclick="cargar('conductor.html', this, 'active-cond')">
      🚕 Modo Chofer
    </button>
  </div>

  <div class="frame-container">
    <iframe id="mainFrame" src="pasajero.html"></iframe>
  </div>

  <script>
    function cargar(url, btn, activeClass) {
      document.getElementById('mainFrame').src = url;
      document.querySelectorAll('.switch-btn').forEach(b => {
        b.className = 'switch-btn';
      });
      btn.className = 'switch-btn ' + activeClass;
    }
  </script>
</body>
</html>
