plugins {
    id 'com.android.application'
}

android {
    namespace 'ec.macondo.express'
    compileSdk 35

    defaultConfig {
        applicationId "ec.macondo.express"
        minSdk 24
        targetSdk 34
        versionCode 150
        versionName "1.5.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    flavorDimensions = ["role"]
    productFlavors {
        pasajero {
            dimension "role"
            applicationId "ec.macondo.pasajero"
            resValue "string", "app_name", "Macondo Pasajero"
            resValue "string", "default_role", "pasajero"
        }
        conductor {
            dimension "role"
            applicationId "ec.macondo.conductor"
            resValue "string", "app_name", "Macondo Conductor"
            resValue "string", "default_role", "conductor"
        }
        suite {
            dimension "role"
            applicationId "ec.macondo.express"
            resValue "string", "app_name", "Macondo Express"
            resValue "string", "default_role", "suite"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
